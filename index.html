<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Che personaggio sei di KawaiiYamiShop?</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive;
      background-color: #fff0f5;
      color: #333;
      text-align: center;
      padding: 20px;
    }
    .question {
      margin: 20px 0;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      border: none;
      background-color: #ffb6c1;
      color: #000;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .selected {
      background-color: #ff69b4;
    }
    #result {
      margin-top: 30px;
    }
    img {
      width: 300px;
      max-width: 90%;
      border-radius: 15px;
    }
  </style>
</head>
<body>
  <h1>Che personaggio sei di KawaiiYamiShop?</h1>

  <div id="quiz"></div>
  <div id="result"></div>

  <script>
    const questions = [
      {
        text: "Preferisci leggere un libro vicino a una candela o andare a una festa affollata?",
        options: [
          { label: "Leggere un libro", character: "Tomoe" },
          { label: "Andare a una festa", character: "Dodo" }
        ]
      },
      {
        text: "Ti piacciono di più i fiori o le stelle?",
        options: [
          { label: "Fiori", character: "Yume" },
          { label: "Stelle", character: "Anya" }
        ]
      },
      {
        text: "Come ti descriveresti?",
        options: [
          { label: "Curiosa e brillante", character: "Kitsu" },
          { label: "Sensibile e tranquilla", character: "Miyun" }
        ]
      },
      {
        text: "Preferisci stare sola a riflettere o chiacchierare con chi ami?",
        options: [
          { label: "Sola a riflettere", character: "Iaia" },
          { label: "Chiacchierare", character: "Kurob" }
        ]
      }
    ];

    const descriptions = {
      'Tomoe': {
        img: 'img/tomoe.jpg',
        text: 'Tomoe è la gufetta saggia e gentile. Ama i misteri e il silenzio della notte. Frase guida: "Non devi avere tutte le risposte, solo un posto sicuro dove iniziare a cercarle."'
      },
      'Yume': {
        img: 'img/yume.jpg',
        text: 'Yume è una cerbiatta empatica e sognatrice. Frase guida: "La dolcezza è una forma di coraggio".'
      },
      'Kitsu': {
        img: 'img/kitsu.jpg',
        text: 'Kitsu è una volpe brillante e furba, ama la tecnologia. Frase guida: "La curiosità è il mio superpotere!"'
      },
      'Miyon': {
        img: 'img/miyon.jpg',
        text: 'Miyon è una gattina nera misteriosa. Frase guida: "Non devi essere luminosa per brillare".'
      },
      'Miyun': {
        img: 'img/miyun.jpg',
        text: 'Miyun è una gattina bianca timida e sensibile. Frase guida: "Anche le anime tranquille brillano, solo in silenzio."'
      },
      'Iaia': {
        img: 'img/iaia.jpg',
        text: 'Iaia è un gatto siamese metà rosa e metà nero. Intuitiva, misteriosa, riflessiva. Frase guida: "Le cose preziose non fanno rumore."'
      },
      'Dodo': {
        img: 'img/dodo.jpg',
        text: 'Dodo è uno scoiattolino rosa gioioso e affettuoso. Frase guida: "La gioia è contagiosa, spargila ovunque!"'
      },
      'Kurob': {
        img: 'img/kurob.jpg',
        text: 'Kurob è un panda punk, ribelle ma tenero. Frase guida: "Anche chi graffia, può proteggere."'
      },
      'Anya': {
        img: 'img/anya.jpg',
        text: 'Anya è l’unicorno gotico e sensibile. Frase guida: "Diversa non significa sbagliata."'
      }
    };

    let currentQuestion = 0;
    const answers = {};

    function showQuestion() {
      const quiz = document.getElementById('quiz');
      quiz.innerHTML = '';

      if (currentQuestion >= questions.length) {
        showResult();
        return;
      }

      const q = questions[currentQuestion];
      const questionDiv = document.createElement('div');
      questionDiv.className = 'question';

      const questionText = document.createElement('p');
      questionText.textContent = q.text;
      questionDiv.appendChild(questionText);

      q.options.forEach(option => {
        const btn = document.createElement('button');
        btn.textContent = option.label;
        btn.onclick = () => {
          answers[option.character] = (answers[option.character] || 0) + 1;
          currentQuestion++;
          showQuestion();
        };
        questionDiv.appendChild(btn);
      });

      quiz.appendChild(questionDiv);
    }

    function showResult() {
      const quiz = document.getElementById('quiz');
      const resultDiv = document.getElementById('result');
      quiz.style.display = 'none';

      let max = 0;
      let character = '';
      for (const [key, value] of Object.entries(answers)) {
        if (value > max) {
          max = value;
          character = key;
        }
      }

      const selected = descriptions[character];
      resultDiv.innerHTML = `
        <h2>Il tuo personaggio è ${character}!</h2>
        <img src="${selected.img}" alt="${character}" />
        <p>${selected.text}</p>
        <br><button onclick="location.reload()">🔁 Ricomincia il quiz</button>
      `;
    }

    showQuestion();
  </script>
</body>
</html>
