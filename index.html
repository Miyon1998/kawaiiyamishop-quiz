<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Che personaggio sei di KawaiiYamiShop?</title>
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Gochi Hand', cursive;
      background-color: #fff0f5;
      color: #333;
      text-align: center;
      padding: 20px;
    }

    .question {
      margin: 30px auto;
      padding: 20px;
      max-width: 600px;
      animation: fadeIn 1s ease-in-out;
    }

    button {
      margin: 10px;
      padding: 12px 24px;
      border: none;
      background-color: #ffb6c1;
      color: #000;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background-color: #ff91af;
    }

    #result {
      margin-top: 40px;
    }

    img {
      width: 300px;
      max-width: 90%;
      border-radius: 20px;
      margin-top: 20px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <h1>🌙 Che personaggio sei di KawaiiYamiShop? 🦇</h1>
  <p>In un mondo pieno di dolcezze e misteri... quale anima vive nel tuo cuore?</p>

  <div id="quiz"></div>
  <div id="result"></div>
  <button onclick="restartQuiz()" id="restartBtn" style="display:none;">🔁 Ricomincia il quiz</button>

  <script>
    const questions = [
      {
        text: "📚 Preferisci leggere un libro vicino a una candela o 🥳 andare a una festa affollata?",
        options: [
          { text: "📖 Leggere un libro", value: "Tomoe" },
          { text: "🎉 Andare a una festa", value: "Dodo" }
        ]
      },
      {
        text: "🌸 Ti piacciono di più i fiori o 🌌 le stelle?",
        options: [
          { text: "🌷 Fiori", value: "Yume" },
          { text: "✨ Stelle", value: "Anya" }
        ]
      },
      {
        text: "🔍 Come ti descriveresti?",
        options: [
          { text: "🧠 Curiosa e brillante", value: "Kitsu" },
          { text: "💖 Sensibile e tranquilla", value: "Miyun" }
        ]
      },
      {
        text: "🧘‍♀️ Preferisci stare sola a riflettere o 💬 chiacchierare con chi ami?",
        options: [
          { text: "🌙 Sola a riflettere", value: "Iaia" },
          { text: "🎀 Chiacchierare", value: "Kurob" }
        ]
      }
    ];

    const descriptions = {
      'Tomoe': {
        img: 'img/tomoe.jpg',
        text: 'Tomoe è la gufetta saggia e gentile. Ama i misteri e il silenzio della notte. Frase guida: "Non devi avere tutte le risposte, solo un posto sicuro dove iniziare a cercarle."'
      },
      'Yume': {
        img: 'img/yume.jpg',
        text: 'Yume è una cerbiatta empatica e sognatrice. Frase guida: "La dolcezza è una forma di coraggio".'
      },
      'Kitsu': {
        img: 'img/kitsu.jpg',
        text: 'Kitsu è una volpe brillante e furba, ama la tecnologia. Frase guida: "La curiosità è il mio superpotere!"'
      },
      'Miyon': {
        img: 'img/miyon.jpg',
        text: 'Miyon è una gattina nera misteriosa. Frase guida: "Non devi essere luminosa per brillare".'
      },
      'Miyun': {
        img: 'img/miyun.jpg',
        text: 'Miyun è una gattina bianca timida e sensibile. Frase guida: "Anche le anime tranquille brillano, solo in silenzio."'
      },
      'Iaia': {
        img: 'img/iaia.jpg',
        text: 'Iaia è un gatto siamese metà rosa e metà nero. Intuitiva, misteriosa, riflessiva. Frase guida: "Le cose preziose non fanno rumore."'
      },
      'Dodo': {
        img: 'img/dodo.jpg',
        text: 'Dodo è uno scoiattolino rosa gioioso e affettuoso. Frase guida: "La gioia è contagiosa, spargila ovunque!"'
      },
      'Kurob': {
        img: 'img/kurob.jpg',
        text: 'Kurob è un panda punk, ribelle ma tenero. Frase guida: "Anche chi graffia, può proteggere."'
      },
      'Anya': {
        img: 'img/anya.jpg',
        text: 'Anya è l’unicorno gotico e sensibile. Frase guida: "Diversa non significa sbagliata."'
      }
    };

    let currentQuestion = 0;
    const answers = {};

    function showQuestion() {
      const quizDiv = document.getElementById('quiz');
      quizDiv.innerHTML = '';

      if (currentQuestion < questions.length) {
        const q = questions[currentQuestion];
        const qDiv = document.createElement('div');
        qDiv.className = 'question';
        qDiv.innerHTML = `<p>${q.text}</p>`;

        q.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.innerText = opt.text;
          btn.onclick = () => {
            answers[opt.value] = (answers[opt.value] || 0) + 1;
            currentQuestion++;
            showQuestion();
          };
          qDiv.appendChild(btn);
        });

        quizDiv.appendChild(qDiv);
      } else {
        showResult();
      }
    }

    function showResult() {
      const quizDiv = document.getElementById('quiz');
      quizDiv.style.display = 'none';

      const resultDiv = document.getElementById('result');

      let max = 0;
      let character = '';
      for (const [key, value] of Object.entries(answers)) {
        if (value > max) {
          max = value;
          character = key;
        }
      }

      const selected = descriptions[character];
      resultDiv.innerHTML = `
        <h2>🌟 Il tuo personaggio è ${character}! 🌟</h2>
        <img src="${selected.img}" alt="${character}" />
        <p>${selected.text}</p>
      `;

      document.getElementById('restartBtn').style.display = 'inline-block';
    }

    function restartQuiz() {
      location.reload();
    }

    window.onload = showQuestion;
  </script>

</body>
</html>
